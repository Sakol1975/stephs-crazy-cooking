
<!doctype html>
<html lang="nl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090605">
  <title>{{ page.title }} | Steph’s Crazy Cooking</title>
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site">
    <header class="site-header">
      <div class="brand-row" aria-label="Steph’s Crazy Cooking">
        <img
          class="corner-logo corner-logo-left"
          src="{{ '/assets/logo-vlammende-koksmuts.png' | relative_url }}"

        <img
          class="center-logo"

      </div>

      <nav class="main-nav" aria-label="Hoofdnavigatie">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/recepten.html' | relative_url }}">Recepten</a>
        <a href="{{ '/tips.html' | relative_url }}">Tips &amp; Tricks</a>
        <a href="{{ '/blog.html' | relative_url }}">Blog</a>
        <a href="{{ '/steph.html' | relative_url }}">Steph</a>
      </nav>
    </header>

    <main class="page-content">
      {{ content }}
    </main>

    <footer style="width:min(100% - 32px, 900px); margin:0 auto; padding:0 12px 18px; text-align:right; font-size:.78rem; line-height:1.4;">
      <a
        href="{{ '/disclaimer.html' | relative_url }}"
        style="color:#fff1e5; opacity:.72; text-decoration:none;">
        Disclaimer
      </a>

  </div>

</html>

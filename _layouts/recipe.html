<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="{{ page.description | default: page.title | escape }} - Steph's Crazy Cooking.">
  <title>{{ page.title | escape }} | Steph's Crazy Cooking</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #080808; }
    body {
      margin: 0; min-height: 100vh; color: #f7eee5;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(rgba(8, 6, 5, .70), rgba(8, 6, 5, .82)),
        url("{{ '/assets/site-background.png' | relative_url }}") center center / cover fixed no-repeat, #080808;
    }
    .page { width: min(1120px, 92%); margin: 0 auto; padding: 34px 0 42px; }
    h1 { margin:0 0 12px; color:#ff7417; text-align:center; font-size:clamp(2.5rem,6vw,4.5rem); line-height:1.05; font-style:italic; text-shadow:0 2px 5px #000,0 0 18px #a9420b; }
    .rule { width:min(360px,60%); height:3px; margin:20px auto 34px; background:#a95a2c; }
    .layout { display:grid; grid-template-columns:1fr 1.08fr; gap:24px; align-items:start; }
    section { padding:clamp(22px,3vw,34px); border:1px solid rgba(255,138,54,.42); border-radius:18px; background:rgba(18,15,13,.88); box-shadow:0 12px 34px rgba(0,0,0,.35); }
    h2 { margin:0 0 24px; color:#ff9a50; font-size:clamp(1.35rem,2.7vw,1.8rem); letter-spacing:.04em; }
    .ingredient { margin:0 0 23px; }
    .ingredient:last-child { margin-bottom:0; }
    h3 { margin:0 0 7px; color:#fff2df; font-size:1.12rem; }
    p { margin:0; color:#e5d6c5; font-size:1.04rem; line-height:1.62; }
    ol { list-style:none; counter-reset:step; margin:0; padding:0; }
    ol li { counter-increment:step; position:relative; min-height:44px; margin:0 0 22px; padding:2px 0 0 58px; color:#f7eee5; font-size:1.08rem; line-height:1.6; }
    ol li:last-child { margin-bottom:0; }
    ol li::before { content:counter(step); position:absolute; left:0; top:0; display:grid; place-items:center; width:40px; height:40px; border-radius:50%; color:#21150e; background:#f58236; font:bold 1.1rem Arial,sans-serif; }
    .notes { margin-top:24px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .note { padding:20px 22px; border-left:4px solid #f58236; border-radius:10px; background:rgba(30,23,18,.9); }
    .note h2 { margin-bottom:8px; font-size:1.12rem; }
    .note p { font-size:1rem; }
    .steph-like-wrap { display:flex; justify-content:center; margin:30px 0 12px; }
    .steph-like-button { display:inline-flex; align-items:center; gap:9px; padding:11px 19px; border:1px solid #b95b2b; border-radius:999px; background:rgba(18,12,9,.92); color:#ffe4c5; font:600 1rem Georgia,serif; cursor:pointer; box-shadow:0 0 14px rgba(255,105,25,.15); transition:background .18s ease,transform .18s ease,border-color .18s ease; }
    .steph-like-button:hover:not(:disabled) { transform:translateY(-1px); border-color:#ff9a50; }
    .steph-like-heart { color:#ff7a32; font-size:1.35rem; line-height:1; }
    .steph-like-button.is-liked { border-color:#ff7a32; background:rgba(91,35,12,.75); cursor:default; }
    .steph-like-button.is-loading { opacity:.65; cursor:wait; }
    @media (max-width:760px) { .page{padding-top:26px;} .layout{grid-template-columns:1fr;} .notes{grid-template-columns:1fr;} body{background-attachment:scroll;} }
  </style>
</head>
<body>
  <main class="page">
    <h1>{{ page.title | escape }}</h1>
    <div class="rule" aria-hidden="true"></div>
    {{ content }}
    <div class="steph-like-wrap">
      <button class="steph-like-button" type="button"
              data-like-button data-content-type="recept"
              data-content-id="{{ page.url | slugify }}"
              aria-pressed="false">
        <span class="steph-like-heart" data-like-heart aria-hidden="true">♡</span>
        <span data-like-count>0</span>
        <span data-like-label>likes</span>
      </button>
    </div>
  </main>
  <script src="{{ '/assets/js/likes.js' | relative_url }}" defer></script>
</body>
</html>


<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Things are Cooking... | Steph's Crazy Cooking</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080808}
body{font-family:Georgia,'Times New Roman',serif;color:#f7eee5}

.hero{
 position:relative;width:100%;max-width:1920px;
 margin:0 auto;line-height:0
}
.hero img{display:block;width:100%;height:auto}

.nav-hit{
 position:absolute;top:0;height:7.5%;
 display:block;background:transparent;
 outline-offset:-3px;z-index:5
}
.home{left:9.5%;width:12%}
.recipes{left:22%;width:13%}
.slow{left:35.5%;width:14%}
.bbq{left:49.5%;width:9%}
.tips{left:59%;width:16%}
.about{left:75.5%;width:15%}
.search{left:91%;width:7%}

.nav-hit:focus-visible{
 outline:2px solid #ff7417
}

/* Eén verplaatsbare oranje brush */
.active-brush{
 position:absolute;top:0.5%;height:6.5%;
 z-index:3;pointer-events:none;
 background:
 linear-gradient(176deg,transparent 0 5%,#f47716 8% 85%,transparent 91%),
 linear-gradient(2deg,transparent 0 8%,#f47716 14% 88%,transparent 94%);
 clip-path:polygon(
  5% 12%,18% 5%,92% 8%,98% 20%,
  94% 82%,84% 94%,10% 88%,1% 70%,3% 25%
 );
 filter:drop-shadow(0 0 8px #f47716);
 transition:left .2s ease,width .2s ease;
}

/* Tekst boven de brush */
.nav-label{
 position:absolute;top:1.1%;height:5.5%;
 z-index:4;display:flex;
 align-items:center;justify-content:center;
 pointer-events:none;
 color:#f7eee5;
 font-family:Georgia,'Times New Roman',serif;
 font-size:clamp(10px,1.8vw,27px);
 font-style:italic;font-weight:bold;
 text-shadow:0 1px 3px #000,0 0 5px #000;
 white-space:nowrap
}

.label-home{left:9.5%;width:12%}

.message{
 position:absolute;left:8%;right:8%;top:73%;
 z-index:2;text-align:center;line-height:1.12;
 text-shadow:0 3px 10px #000,0 0 18px #000
}
.message h1{
 margin:0;color:#ff7417;
 font-size:clamp(25px,5.2vw,78px);
 font-style:italic;font-weight:bold;
 text-shadow:0 2px 3px #000,0 0 16px #f47716
}
.message p{
 margin:8px 0 0;color:#f7eee5;
 font-size:clamp(18px,3.5vw,52px);
 font-style:italic;font-weight:bold
}

@media(max-width:600px){
 .message{top:72%}
 .nav-hit{height:8%}
 .active-brush{height:7%}
}
</style>
</head>

<body>
<main class="hero" aria-label="Steph's Crazy Cooking – binnenkort beschikbaar">

<img src="assets/homepage-master-zonder-intro.png"
 alt="Steph's Crazy Cooking">

<div id="activeBrush" class="active-brush" aria-hidden="true"></div>

<span id="activeLabel" class="nav-label"></span>

<div class="message">
<h1>Things are Cooking...</h1>
<p>Come back soon.</p>
</div>

<a class="nav-hit home" href="./index.html" aria-label="Home"></a>
<a class="nav-hit recipes" href="./coming-soon.html?section=recepten" aria-label="Recepten"></a>
<a class="nav-hit slow" href="./coming-soon.html?section=slowcooker" aria-label="Slowcooker"></a>
<a class="nav-hit bbq" href="./coming-soon.html?section=bbq" aria-label="BBQ"></a>
<a class="nav-hit tips" href="./coming-soon.html?section=tips" aria-label="Tips en Tricks"></a>
<a class="nav-hit about" href="./coming-soon.html?section=over-stephan" aria-label="Over Stephan"></a>
<a class="nav-hit search" href="./coming-soon.html?section=zoeken" aria-label="Zoeken"></a>

</main>

<script>
(function(){

 const params = new URLSearchParams(window.location.search);
 const section = params.get('section') || 'home';

 const positions = {
  'home':['9.5%','12%','Home'],
  'recepten':['22%','13%','Recepten'],
  'slowcooker':['35.5%','14%','Slowcooker'],
  'bbq':['49.5%','9%','BBQ'],
  'tips':['59%','16%','Tips & Tricks'],
  'over-stephan':['75.5%','15%','Over Stephan'],
  'zoeken':['91%','7%','Zoeken']
 };

 const active = positions[section] || positions['home'];

 const brush = document.getElementById('activeBrush');
 const label = document.getElementById('activeLabel');

 brush.style.left = active[0];
 brush.style.width = active[1];

 label.textContent = active[2];
 label.style.left = active[0];
 label.style.width = active[1];

})();
</script>

</body>
</html>

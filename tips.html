<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090605">
  <title>Tips &amp; Tricks | Steph’s Crazy Cooking</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .tips-content {
      width: min(100%, 920px);
      margin: clamp(22px, 4vh, 46px) auto 40px;
      padding: clamp(10px, 2vw, 24px);
      color: #fff1e5;
      text-align: left;
      text-shadow: 0 2px 12px #000, 0 0 18px #000;
    }
    .tips-heading {
      margin: 0 0 clamp(22px, 4vh, 38px);
      text-align: center;
      color: #ffb15a;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-style: italic;
    }
    .tip-item {
      display: grid;
      grid-template-columns: clamp(42px, 6vw, 66px) minmax(0, 1fr);
      align-items: start;
      column-gap: clamp(12px, 2vw, 22px);
    }
    .tip-icon { display:block; width:100%; height:auto; object-fit:contain; filter:drop-shadow(0 2px 8px #000); }
    .tip-copy { min-width:0; }
    .tip-copy h2 { margin:0 0 .55em; color:#ffc078; font-size:clamp(1.25rem,2.5vw,1.85rem); line-height:1.2; }
    .tip-copy p { margin:0 0 .85em; color:#fff1e5; font-size:clamp(1rem,1.6vw,1.15rem); line-height:1.65; }
    .dusdit-link { display:inline-flex; align-items:center; vertical-align:middle; margin:.15em 0 .3em; text-decoration:none; }
    .dusdit-link img { display:block; width:clamp(92px, 13vw, 142px); height:auto; max-height:36px; object-fit:contain; }
    .dusdit-link:focus-visible { outline:2px solid #ffb15a; outline-offset:5px; border-radius:3px; }
    .flame-divider { height:13px; margin:clamp(22px,4vh,36px) 0; position:relative; overflow:hidden; opacity:.95; }
    .flame-divider::before { content:""; position:absolute; left:0; right:0; top:5px; height:3px; background:linear-gradient(90deg,transparent,#9d310e 8%,#ff6a16 28%,#ffd078 50%,#ff6a16 72%,#9d310e 92%,transparent); box-shadow:0 0 7px #ff5b12,0 0 14px #b83b0b; border-radius:50%; }
    .flame-divider::after { content:""; position:absolute; left:8%; right:8%; top:0; height:10px; background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,112,24,.8) 19px 21px,transparent 22px 38px); clip-path:polygon(0 70%,4% 30%,7% 75%,11% 5%,15% 75%,19% 35%,23% 80%,27% 10%,31% 75%,35% 35%,39% 80%,43% 10%,47% 75%,51% 30%,55% 80%,59% 5%,63% 75%,67% 30%,71% 80%,75% 10%,79% 75%,83% 35%,87% 80%,91% 10%,95% 75%,100% 35%,100% 100%,0 100%); filter:drop-shadow(0 0 4px #ff5b12); }
    @media(max-width:520px) { .tips-content{padding-inline:8px;} .tip-item{grid-template-columns:38px minmax(0,1fr);column-gap:10px;} .flame-divider{margin:22px 0;} .dusdit-link img{width:clamp(88px,28vw,120px);max-height:31px;} }
  </style>
</head>
<body>
  <div class="site">
    <header class="site-header">
      <div class="brand-row" aria-label="Steph’s Crazy Cooking">
        <img class="corner-logo corner-logo-left" src="./assets/logo-vlammende-koksmuts.png" alt="Vlammende koksmuts met gekruiste messen">
        <img class="center-logo" src="./assets/logo-stephs-crazy-cooking.png" alt="Steph’s Crazy Cooking">
        <img class="corner-logo corner-logo-right" src="./assets/logo-vlammende-koksmuts.png" alt="Vlammende koksmuts met gekruiste messen">
      </div>
      <nav class="main-nav" aria-label="Hoofdnavigatie">
        <a href="./index.html">Home</a>
        <a href="./recepten.html">Recepten</a>
        <a href="./tips.html" aria-current="page">Tips &amp; Tricks</a>
        <a href="./steph.html">Steph</a>
      </nav>
    </header>

    <main class="tips-content">
      <h1 class="tips-heading">Tips &amp; Tricks</h1>
      <article class="tip-item">
        <img class="tip-icon" src="./assets/logo-vlammende-koksmuts.png" alt="">
        <div class="tip-copy">
          <h2>Iets leuks om aan te trekken?</h2>
          <p>Wil je iets leuks om aan te trekken met je eigen verzonnen tekst of afbeelding? Dan heb ik een leuke site voor je. Ik bedoel natuurlijk …</p>
          <p><a class="dusdit-link" href="https://dusdit.com" target="_blank" rel="noopener noreferrer" aria-label="Bezoek DusDit.com"><img src="./assets/dusdit-logo.png" alt="DusDit"></a></p>
        </div>
      </article>
      <div class="flame-divider" role="separator" aria-label="Einde van deze tip"></div>
    </main>
  </div>
</body>
</html>

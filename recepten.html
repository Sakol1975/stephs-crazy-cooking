---
layout: default
title: Recepten
permalink: /recepten.html
---

<style>
  .recipes-content {
    width: min(100% - 32px, 1050px);
    margin: clamp(24px, 5vh, 56px) auto 48px;
    padding: 0 12px;
    color: #fff1e5;
    text-shadow: 0 2px 12px #000, 0 0 18px #000;
    text-align: left;
  }

  .recipes-content h1 {
    margin: 0 0 22px;
    color: #ffb15a;
    font-size: clamp(1.7rem, 3.6vw, 2.5rem);
    font-style: italic;
    line-height: 1.2;
  }

  .tip-search {
    width: min(100%, 620px);
    margin: 0 0 clamp(26px, 5vh, 44px);
  }

  .tip-search label {
    display: block;
    margin-bottom: 10px;
    color: #ffb15a;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.15rem, 2.5vw, 1.55rem);
    font-style: italic;
    font-weight: 700;
  }

  .tip-search input {
    box-sizing: border-box;
    width: 100%;
    min-height: 46px;
    padding: 10px 15px;
    border: 1px solid #b94b1c;
    border-radius: 8px;
    background: rgba(12, 8, 6, .88);
    color: #fff1e5;
    font: inherit;
    font-size: 1rem;
    box-shadow: 0 0 12px rgba(255, 91, 18, .22);
  }

  .tip-search input:focus {
    outline: 2px solid #ffb15a;
    outline-offset: 3px;
  }

  .tip-search input::placeholder {
    color: #c9b6a6;
  }

  .tip-search-status {
    min-height: 1.4em;
    margin: 9px 0 0;
    color: #f4c18c;
    font-size: .92rem;
  }

  .recipe-item[hidden] {
    display: none !important;
  }

  .recipe-list {
    display: grid;
    gap: 13px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .recipe-item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255, 138, 54, .3);
    text-align: left;
  }

  .recipe-item img {
    display: block;
    flex: 0 0 36px;
    width: 36px;
    height: 36px;
    object-fit: contain;
  }

  .recipe-item a {
    color: #fff1e5;
    font-size: clamp(1rem, 2vw, 1.15rem);
    font-weight: bold;
    text-decoration: none;
    text-underline-offset: 4px;
  }

  .recipe-item a:hover,
  .recipe-item a:focus-visible {
    color: #ffb15a;
    text-decoration: underline;
  }
</style>

<section class="recipes-content">
  <h1>Recepten</h1>

  <div class="tip-search">
    <label for="recipe-search-input">
      Vurig op zoek naar ...?
    </label>

    <input
      id="recipe-search-input"
      type="search"
      placeholder="Typ een zoekwoord, bijvoorbeeld kruiden"
      autocomplete="off"
      aria-describedby="recipe-search-status">

    <p
      class="tip-search-status"
      id="recipe-search-status"
      role="status"
      aria-live="polite">
      Alle recepten worden getoond.
    </p>
  </div>

  <ul class="recipe-list" id="recipeList">
    {% assign sorted_recepten = site.recepten | sort: "date" | reverse %}
    {% for recipe in sorted_recepten %}
      <li
        class="recipe-item"
        data-search="{{ recipe.title | downcase | escape }} {{ recipe.search_terms | default: '' | downcase | escape }}">

        <img
          src="{{ '/assets/logo-vlammende-koksmuts.png' | relative_url }}"
          alt=""
          aria-hidden="true">

        <a href="{{ recipe.url | relative_url }}">
          {{ recipe.title | escape }}
        </a>
      </li>
    {% endfor %}
  </ul>
</section>

<script>
  (() => {
    const input = document.getElementById('recipe-search-input');
    const status = document.getElementById('recipe-search-status');
    const recipes = Array.from(
      document.querySelectorAll('.recipe-item')
    );

    function normalize(value) {
      return value
        .toLocaleLowerCase('nl-NL')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function filterRecipes() {
      const query = normalize(input.value.trim());
      let visibleCount = 0;

      recipes.forEach((recipe) => {
        const searchableText = normalize(
          recipe.innerText + ' ' + (recipe.dataset.search || '')
        );

        const matches = !query || searchableText.includes(query);
        recipe.hidden = !matches;

        if (matches) {
          visibleCount++;
        }
      });

      if (!query) {
        status.textContent = 'Alle recepten worden getoond.';
      } else if (visibleCount === 0) {
        status.textContent =
          'Geen recepten gevonden. Probeer een ander zoekwoord.';
      } else {
        status.textContent = visibleCount === 1
          ? '1 recept gevonden.'
          : visibleCount + ' recepten gevonden.';
      }
    }

    input.addEventListener('input', filterRecipes);
  })();
</script>
